# pyftools app manifest. Every folder under apps/ that has one of these is
# auto-discovered and reverse-proxied under /app/<folder-name>/ -- no central
# registry to edit, same zero-config spirit as the cli_scripts/ tools.
#
# cmd supports {python} (sys.executable) and {port} (the assigned internal
# port, bound to 127.0.0.1 only -- never exposed directly) placeholders.

description: "Generate switch stack VLAN port-map images from CSV exports"
port: 8001
cmd: ["{python}", "-m", "uvicorn", "web.app:app", "--host", "127.0.0.1", "--port", "{port}"]
